services:
  - type: worker
    name: bio-link-protector
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DATABASE_NAME
        value: bio_link_protector
      - key: DEFAULT_DELETE_SECONDS
        value: "0"
      - key: MAX_DELETE_SECONDS
        value: "86400"
